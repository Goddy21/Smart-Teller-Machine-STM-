spring:
  application:
    name: stm-middleware
  profiles:
    default: demo
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stm}
    username: ${DB_USER:stm}
    password: ${DB_PASSWORD:stm}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 8MB

stm:
  provisioning-secret: ${PROVISIONING_SECRET:dev-provisioning-secret}
  portal-api-key: ${PORTAL_API_KEY:dev-portal-key}
  require-client-cert: false
  low-card-stock: 50
  # Browser origins allowed to call the API / open the signaling WebSocket (comma-separated in the env var).
  # Dev default covers the Vite dev server. Same-origin pages never need to be listed.
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://localhost:5174,http://127.0.0.1:5174}
  ws-ticket-ttl-seconds: 30         # one-time WebSocket ticket lifetime
  allow-teller-key-in-query: true   # legacy ?key= teller sign-in on the WebSocket; disabled in prod
  portal-auth:                      # STM portal sign-in (accounts live in portal_users)
    idle-minutes: 30                # signed out after 30 min without activity
    absolute-hours: 10              # and after 10 h in any case
    max-failed-attempts: 5          # wrong passwords in a row before the account locks
    lock-minutes: 15
    allow-shared-key: true          # DEV: scripts may still use X-Portal-Key (demo-journey.ps1). False in prod.
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}   # blank = random, printed once in the log
  session:
    max-minutes: 30                 # absolute session lifetime (D-2 expiresAt)
    idle-seconds: 600               # server-side safety net: sessions with no call for this long expire
    inactivity-timeout-sec: 60      # told to the kiosk in D-2: its own "are you still there?" countdown
  call-control:
    url: ${CALL_CONTROL_URL:http://localhost:8090}   # stm-video call-control, for "Talk to a teller" (D-8)
  kyc:
    sim-swap-block-hours: 72        # no OTP to a number whose SIM was swapped within this many hours (403 SIM_SWAP_RISK)
    review-years: { low: 3, medium: 2, high: 1 }   # KYC refresh cycle by risk rating
    due-soon-days: 30               # status DUE_SOON this many days before the review date
  cash:
    retract-credit: IMMEDIATE       # IMMEDIATE: W-4 reverses at once. AFTER_COUNT: PENDING_RECONCILIATION until the retract bin is counted
  receipt:
    bank-name: BLUE RIVER SMART TELLER
    verify-url: https://bank.example/r/

management:
  endpoints:
    web:
      exposure:
        include: health,info
