services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: stm
      POSTGRES_USER: stm
      POSTGRES_PASSWORD: stm
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stm -d stm"]
      interval: 5s
      timeout: 3s
      retries: 12

  middleware:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://db:5432/stm
      DB_USER: stm
      DB_PASSWORD: stm
    ports: ["8080:8080"]

volumes:
  pgdata:
