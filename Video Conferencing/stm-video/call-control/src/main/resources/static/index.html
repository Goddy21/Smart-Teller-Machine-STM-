<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STM video teller: test pages</title>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#14202b;--mute:#5b6b7a;--line:#d5dce3;--amber:#b85f00;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--panel:#16212d;--ink:#e6edf3;--mute:#9aabbb;--line:#2a3a4a;--amber:#f0a04b;color-scheme:dark}}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Roboto,Arial,sans-serif;margin:0;padding:24px 16px}
main{max-width:720px;margin:0 auto}
a.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--amber)}
a.card b{display:block;font-size:17px}
.mute{color:var(--mute);font-size:14px}
code{font-size:13px}
</style>
</head>
<body>
<main>
<h1>STM video teller: test pages</h1>
<p class="mute">Served by call-control in the <code>dev</code> profile. Not for production.</p>
<a class="card" href="/teller/index.html"><b>Teller console</b><span class="mute">Open on the teller's PC (your laptop). Go available, then wait for a call.</span></a>
<a class="card" href="/kiosk/kiosk-test.html"><b>Kiosk test page</b><span class="mute">Open on the STM (or a second browser window). Pick cameras, tap "Speak to a teller".</span></a>
<p class="mute" id="ctx"></p>
</main>
<script>
document.getElementById("ctx").textContent = window.isSecureContext
  ? "This browser treats the page as a secure origin: cameras will work."
  : "This browser does NOT treat this address as secure, so cameras will be blocked. On this machine use http://localhost:8080, or start Chrome/Edge with --unsafely-treat-insecure-origin-as-secure=" + location.origin + " (see the README).";
</script>
</body>
</html>
