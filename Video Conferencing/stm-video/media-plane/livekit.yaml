port: 7880
log_level: info
rtc:
  tcp_port: 7881            # ICE/TCP fallback
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
redis:
  address: localhost:6379   # production: Sentinel/Cluster
keys:
  devkey: change-me-to-a-32+char-secret-value-0000   # production: from Vault, rotated
turn:
  enabled: true
  domain: turn.example.com
  tls_port: 5349            # for 443: put an L4 TLS passthrough in front, or add a dedicated coturn
  udp_port: 3478
  cert_file: /certs/turn.crt
  key_file: /certs/turn.key
webhook:
  api_key: devkey
  urls:
    - http://localhost:8080/webhooks/livekit
