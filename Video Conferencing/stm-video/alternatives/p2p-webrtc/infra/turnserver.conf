# Coturn with time-limited credentials (TURN REST API). Spring Boot issues them; the secret never reaches a browser.
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET    # must equal turn.secret in application.yml
realm=turn.stm.yourdomain.com
server-name=turn.stm.yourdomain.com

# Relay port range: open exactly this range (UDP and TCP) in the firewall.
min-port=49160
max-port=49300
total-quota=200
user-quota=12
stale-nonce=600

cert=/certs/fullchain.pem
pkey=/certs/privkey.pem
no-tlsv1
no-tlsv1_1

no-cli
no-multicast-peers
# Behind NAT (typical for a cloud VM): external-ip=PUBLIC_IP/PRIVATE_IP
#external-ip=203.0.113.10/10.0.0.5

# If this TURN server faces the internet, deny relaying into private networks. Leave these OFF if kiosks and
# tellers sit on private bank networks and must relay across them, then restrict with firewall rules instead.
#denied-peer-ip=10.0.0.0-10.255.255.255
#denied-peer-ip=172.16.0.0-172.31.255.255
#denied-peer-ip=192.168.0.0-192.168.255.255
