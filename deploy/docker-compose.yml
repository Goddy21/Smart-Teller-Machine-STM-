# Smart Teller platform on one Linux server: middleware, portal, video (call-control + LiveKit), PostgreSQL, Redis.
# The ",z" on file mounts lets them work with SELinux enforcing (RHEL, Rocky, Alma, CentOS); harmless elsewhere.
# Run ./setup.sh once (makes .env, the TLS certificate and livekit.yaml), then:  docker compose up -d --build
# Only nginx (HTTPS_PORT from .env, 443 by default) and LiveKit media (7881/tcp, 7882/udp) are reachable from the network.
name: stm

# Resource caps, so the STM never starves the other applications on this shared server. Each value can be raised in
# .env without editing this file. Logs are rotated (3 x 10 MB per container) instead of growing until the disk is full.
# Check what each container really uses with:  docker stats --no-stream
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    mem_limit: ${PG_MEM:-512m}
    cpus: ${PG_CPUS:-1.0}
    # Small-server tuning: the two apps use at most ~20 connections between them.
    command: ["postgres", "-c", "max_connections=40", "-c", "shared_buffers=96MB", "-c", "effective_cache_size=256MB",
              "-c", "work_mem=4MB", "-c", "maintenance_work_mem=32MB", "-c", "wal_buffers=4MB",
              "-c", "log_min_duration_statement=2000"]
    environment:
      POSTGRES_DB: stm
      POSTGRES_USER: stm
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro,z      # creates the callcontrol database on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stm -d stm"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    logging: *logging
    mem_limit: ${REDIS_MEM:-128m}
    cpus: ${REDIS_CPUS:-0.5}
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "volatile-lru"]
    volumes: [redisdata:/data]

  middleware:
    build:
      context: ../stm-middleware
    restart: unless-stopped
    logging: *logging
    mem_limit: ${MIDDLEWARE_MEM:-768m}
    cpus: ${MIDDLEWARE_CPUS:-1.5}
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: demo                  # simulated bank systems until the real adapters exist
      # Test mode: accept whatever the kiosk sends (any ID, fingerprint, KRA PIN, signature, code). Set false in .env
      # to test the failure paths; the Simulator page in the portal also switches it.
      SIM_ACCEPT_ALL: ${SIM_ACCEPT_ALL:-true}
      DB_URL: jdbc:postgresql://postgres:5432/stm
      DB_USER: stm
      DB_PASSWORD: ${DB_PASSWORD}
      PROVISIONING_SECRET: ${PROVISIONING_SECRET}
      PORTAL_API_KEY: ${PORTAL_API_KEY}
      BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: https://${PUBLIC_HOST}${EXTRA_CORS_ORIGINS:+,${EXTRA_CORS_ORIGINS}}   # EXTRA_CORS_ORIGINS in .env: where the kiosk app is served from, comma-separated
      CALL_CONTROL_URL: http://call-control:8080
      STM_PORTALAUTH_ALLOWSHAREDKEY: ${ALLOW_PORTAL_KEY:-false}   # true only while scripts still use X-Portal-Key
      STM_ALLOWTELLERKEYINQUERY: "false"
      SERVER_FORWARDHEADERSSTRATEGY: framework
      # Portal sign-in codes by email. No SMTP_HOST = simulated: codes show under Portal accounts > Emails.
      PORTAL_EMAIL_OTP: ${PORTAL_EMAIL_OTP:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-STARTTLS}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Smart Teller Portal <no-reply@stm.local>}
      # Java sizes itself from the container limit above: heap at most 65 % of it, the rest for threads and metadata.
      JAVA_TOOL_OPTIONS: >-
        -Duser.timezone=Africa/Nairobi -XX:MaxRAMPercentage=65 -XX:+UseSerialGC -XX:MaxMetaspaceSize=160m
        -XX:ReservedCodeCacheSize=64m -Xss512k -XX:+ExitOnOutOfMemoryError
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: ${MIDDLEWARE_DB_POOL:-10}
      SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: "2"
      TZ: Africa/Nairobi

  call-control:
    build:
      context: "../Video Conferencing/stm-video"
      dockerfile: ../../deploy/call-control.Dockerfile
    restart: unless-stopped
    logging: *logging
    mem_limit: ${CALLCONTROL_MEM:-448m}
    cpus: ${CALLCONTROL_CPUS:-1.0}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      SPRING_PROFILES_ACTIVE: dev                   # identities from cookies (kiosk test page, upper display, portal); see README
      DB_URL: jdbc:postgresql://postgres:5432/callcontrol
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      LIVEKIT_APIKEY: stmkey
      LIVEKIT_APISECRET: ${LIVEKIT_SECRET}
      LIVEKIT_PUBLIC_URL: wss://${PUBLIC_HOST}/livekit
      LIVEKIT_API_URL: http://livekit:7880
      RECORDING_ENABLED: "false"                    # no Egress/MinIO on this server
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=65 -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -Xss512k
        -XX:+ExitOnOutOfMemoryError
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "6"
      SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: "1"
      TZ: Africa/Nairobi

  livekit:
    image: livekit/livekit-server:v1.9.1
    restart: unless-stopped
    logging: *logging
    mem_limit: ${LIVEKIT_MEM:-512m}
    cpus: ${LIVEKIT_CPUS:-1.0}
    command: ["--config", "/etc/livekit.yaml"]
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro,z"]
    ports:
      - "7881:7881/tcp"     # media over TCP (fallback)
      - "7882:7882/udp"     # media over UDP (all calls share this one port)

  web:
    build:
      context: ../stm-portal
      dockerfile: ../deploy/web.Dockerfile
    restart: unless-stopped
    logging: *logging
    mem_limit: ${WEB_MEM:-128m}
    cpus: ${WEB_CPUS:-0.5}
    depends_on: [middleware, call-control, livekit]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro,z
      - ./certs:/etc/nginx/certs:ro,z
    ports:
      - "${HTTPS_PORT:-443}:443"   # 8443 etc. when another web server already uses 443

volumes:
  pgdata:
  redisdata:
